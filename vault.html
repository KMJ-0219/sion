<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>SION — 자료보관함</title>
  <link rel="stylesheet" href="sion.css"/>
  <style>
.vault-wrap{display:flex;height:calc(100vh - 56px);overflow:hidden}
.vault-side{width:230px;flex-shrink:0;border-right:1px solid var(--line-sub);background:var(--bg-raised);padding:14px;display:flex;flex-direction:column;gap:16px;overflow-y:auto}
.vault-main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.vault-toolbar{padding:12px 20px;border-bottom:1px solid var(--line-sub);display:flex;align-items:center;gap:10px;flex-wrap:wrap;row-gap:8px}
.search-box{position:relative;flex:1;min-width:180px;max-width:340px}
.search-box input{padding-right:30px}
.search-box svg{position:absolute;right:9px;top:50%;transform:translateY(-50%);color:var(--tx-3);pointer-events:none}
.sort-sel{background:var(--bg-float);border:1px solid var(--line-mid);border-radius:7px;color:var(--tx-2);font-size:.78rem;padding:6px 9px;outline:none}
.view-toggle{display:flex;background:var(--bg-raised);border:1px solid var(--line-mid);border-radius:7px;padding:3px;gap:2px}
.vt-btn{padding:5px 9px;border-radius:5px;border:none;background:none;color:var(--tx-3);cursor:pointer;display:flex;align-items:center;transition:all .15s}
.vt-btn.active{background:var(--bg-float);color:var(--ac)}
.vault-body{flex:1;overflow-y:auto;padding:18px 20px}
.sec-title{font-size:.62rem;font-weight:700;color:var(--tx-3);text-transform:uppercase;letter-spacing:.12em;margin-bottom:5px}
.cat-rows{display:flex;flex-direction:column;gap:1px}
.cat-row{display:flex;align-items:center;gap:7px;padding:6px 8px;border-radius:6px;cursor:pointer;color:var(--tx-2);font-size:.8rem;font-weight:500;transition:background .12s,color .12s}
.cat-row:hover{background:var(--bg-overlay);color:var(--tx-1)}
.cat-row.active{background:var(--ac-dim);color:var(--ac)}
.cat-n{margin-left:auto;font-size:.62rem;font-family:var(--font-mono);color:var(--tx-4);background:var(--bg-base);padding:1px 5px;border-radius:8px}
.cat-row.active .cat-n{color:var(--ac);background:rgba(0,196,160,.1)}
.tag-cloud{display:flex;flex-wrap:wrap;gap:5px}
.tcloud-tag{padding:3px 9px;border-radius:20px;background:var(--bg-float);border:1px solid var(--line-mid);color:var(--tx-2);font-size:.7rem;cursor:pointer;transition:all .12s}
.tcloud-tag:hover{border-color:var(--ac);color:var(--ac)}
.tcloud-tag.active{background:var(--ac-dim);border-color:var(--ac);color:var(--ac)}

.grid-view{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.list-view-v{display:flex;flex-direction:column;gap:8px}

.v-card{background:var(--bg-raised);border:1px solid var(--line-mid);border-radius:10px;padding:14px;cursor:pointer;transition:border-color .12s,transform .12s;display:flex;flex-direction:column;gap:7px;position:relative}
.v-card:hover{border-color:var(--line-hi);transform:translateY(-1px)}
.v-card-top{display:flex;align-items:flex-start;gap:6px}
.v-pin-btn{width:22px;height:22px;border-radius:6px;border:none;background:transparent;color:var(--tx-4);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;transition:all .12s}
.v-pin-btn:hover{background:var(--bg-overlay);color:var(--tx-2)}
.v-pin-btn.pinned{color:#fbbf24}
.v-title{font-size:.9rem;font-weight:600;color:var(--tx-1);flex:1;line-height:1.4;word-break:break-word}
.v-preview{font-size:.78rem;color:var(--tx-3);line-height:1.6;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.v-meta{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:2px}
.v-tags{display:flex;gap:4px;flex-wrap:wrap}
.v-tag{font-size:.6rem;padding:1px 6px;border-radius:10px;background:var(--bg-overlay);color:var(--tx-3)}
.v-date{font-size:.62rem;color:var(--tx-4);font-family:var(--font-mono);margin-left:auto}
.v-acts{position:absolute;top:10px;right:10px;display:flex;gap:2px;opacity:0;transition:opacity .12s}
.v-card:hover .v-acts{opacity:1}

.list-view-v .v-card{flex-direction:row;align-items:center;gap:12px;padding:10px 14px}
.list-view-v .v-title{font-size:.85rem}
.list-view-v .v-preview{-webkit-line-clamp:1;flex:1;margin:0}
.list-view-v .v-meta{margin-top:0;flex-shrink:0}

.fab-add{position:fixed;bottom:26px;right:26px;width:52px;height:52px;border-radius:50%;background:var(--ac);color:var(--bg-base);border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 18px rgba(0,196,160,.35);transition:all .15s;z-index:60}
.fab-add:hover{background:#00ddb5;transform:scale(1.05)}

@media(max-width:900px){.vault-side{display:none}}
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="brand-mark">SI</div>
      <span class="brand-name">SION</span>
    </div>
    <nav class="sidebar-nav">
      <span class="nav-section-label">메인</span>
      <a href="index.html" class="nav-link">
        <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        <span class="nav-label">대시보드</span>
      </a>
      <span class="nav-section-label">관리</span>
      <a href="schedule.html" class="nav-link">
        <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        <span class="nav-label">스케쥴</span>
      </a>
      <a href="vault.html" class="nav-link active">
        <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
        <span class="nav-label">자료보관함</span>
      </a>
      <span class="nav-section-label">예정</span>
      <a href="#" class="nav-link" style="opacity:.35;pointer-events:none">
        <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span class="nav-label">대화보관함</span>
      </a>
    </nav>
    <div class="sidebar-footer">
      <button class="sidebar-toggle" id="sidebarToggle">
        <svg class="toggle-ico nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 19l-7-7 7-7M21 19l-7-7 7-7"/></svg>
        <span style="font-size:.8rem;color:var(--tx-3)">접기</span>
      </button>
    </div>
  </aside>

  <div class="content" id="content">
    <div class="topbar">
      <span class="topbar-path">SION / 관리 /</span>
      <span class="topbar-title">자료보관함</span>
      <div class="topbar-right">
        <button class="btn btn-primary" id="btn-add-top">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          자료 추가
        </button>
      </div>
    </div>

    <div class="vault-wrap">
      <div class="vault-side">
        <div>
          <div class="sec-title">카테고리</div>
          <div class="cat-rows" id="cat-rows">
            <div class="cat-row active" data-cat="">📋 전체<span class="cat-n" id="cn-all">0</span></div>
          </div>
        </div>
        <div>
          <div class="sec-title">태그</div>
          <div class="tag-cloud" id="tag-cloud"><div style="font-size:.74rem;color:var(--tx-4)">태그 없음</div></div>
        </div>
        <div>
          <div class="sec-title">고정됨</div>
          <button class="cat-row" id="pin-filter" data-pin="0" style="width:100%">📌 고정 자료만 보기</button>
        </div>
      </div>

      <div class="vault-main">
        <div class="vault-toolbar">
          <div class="search-box">
            <input class="input" type="text" id="v-search" placeholder="제목, 내용, 태그 검색..."/>
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
          </div>
          <select class="sort-sel" id="v-sort">
            <option value="new">최신순</option>
            <option value="old">오래된순</option>
            <option value="title">이름순</option>
          </select>
          <span style="font-size:.72rem;color:var(--tx-3);font-family:var(--font-mono)" id="v-count">0건</span>
          <div class="view-toggle" style="margin-left:auto">
            <button class="vt-btn active" data-vt="grid">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
            </button>
            <button class="vt-btn" data-vt="list">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
            </button>
          </div>
        </div>
        <div class="vault-body" id="vault-body">
          <div class="skeleton" style="height:120px;margin-bottom:12px"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<button class="fab-add" id="fab-add" title="자료 추가">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
</button>

<!-- 추가/수정 모달 -->
<div class="modal-backdrop" id="modal-vault">
  <div class="modal">
    <div class="modal-head">
      <span class="modal-title" id="modal-title">자료 추가</span>
      <button class="btn-icon" onclick="SION.ui.closeModal('modal-vault')">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="form-id"/>
      <div class="form-group">
        <label class="input-label">제목 *</label>
        <input class="input" type="text" id="form-title" placeholder="자료 제목"/>
      </div>
      <div class="form-group">
        <label class="input-label">카테고리</label>
        <input class="input" type="text" id="form-cat" placeholder="예: 화학, 코딩, 아이디어 등"/>
      </div>
      <div class="form-group">
        <label class="input-label">태그 (Enter로 추가)</label>
        <input class="input" type="text" id="form-tag-input" placeholder="태그 입력 후 Enter"/>
        <div class="tag-list" id="form-tags" style="margin-top:6px"></div>
      </div>
      <div class="form-group">
        <label class="input-label">내용 *</label>
        <textarea class="input" id="form-content" rows="7" placeholder="저장할 내용"></textarea>
      </div>
      <div class="checkbox-wrap" id="form-pin-wrap">
        <div class="checkbox" id="form-pin-box"></div>
        <span style="font-size:.82rem;color:var(--tx-2)">상단에 고정</span>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn btn-danger btn-sm" id="form-del" style="margin-right:auto;display:none">삭제</button>
      <button class="btn btn-ghost" onclick="SION.ui.closeModal('modal-vault')">취소</button>
      <button class="btn btn-primary" id="form-save">저장</button>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script src="sion.js"></script>
<script>
SION.ui.initSidebar();

const V = {
  all: [],
  fCat: '', fTag: '', fPin: false, fQ: '',
  sort: 'new',
  view: 'grid',
  fTags: [],
  formPinned: false,
};

(async()=>{ await load(); render(); initControls(); })();

async function load(){
  const el = document.getElementById('vault-body');
  try{
    V.all = await SION.db.select('vault_items','order=created_at.desc&limit=1000');
  }catch(e){
    V.all = [];
    SION.ui.toast('로드 실패','error');
  }
}

function getFiltered(){
  let items = [...V.all];
  if (V.fCat) items = items.filter(i=>i.category===V.fCat);
  if (V.fTag) items = items.filter(i=>i.tags?.includes(V.fTag));
  if (V.fPin) items = items.filter(i=>i.is_pinned);
  if (V.fQ){
    const q = V.fQ.toLowerCase();
    items = items.filter(i =>
      i.title?.toLowerCase().includes(q) ||
      i.content?.toLowerCase().includes(q) ||
      i.tags?.some(t=>t.toLowerCase().includes(q))
    );
  }
  items.sort((a,b)=>{
    if (V.sort==='new')  return new Date(b.created_at)-new Date(a.created_at);
    if (V.sort==='old')  return new Date(a.created_at)-new Date(b.created_at);
    if (V.sort==='title') return (a.title||'').localeCompare(b.title||'','ko');
    return 0;
  });
  // 고정 항목 우선 정렬 (전체 정렬 기준을 해치지 않는 선에서)
  items.sort((a,b)=> (b.is_pinned?1:0) - (a.is_pinned?1:0));
  return items;
}

function render(){
  renderSidebar();
  const items = getFiltered();
  document.getElementById('v-count').textContent = `${items.length}건`;
  const el = document.getElementById('vault-body');

  if (!items.length){
    el.innerHTML = `<div class="empty-state" style="padding:80px 20px">
      <div class="empty-state-icon">📁</div>
      <div class="empty-state-text">조건에 맞는 자료가 없습니다</div>
      <div class="empty-state-sub">우측 하단의 + 버튼으로 자료를 추가해보세요</div>
    </div>`;
    return;
  }

  el.innerHTML = `<div class="${V.view==='grid'?'grid-view':'list-view-v'}">${items.map(buildCard).join('')}</div>`;
  bindCardEvents(el);
}

function buildCard(r){
  const dt = SION.date.fmtDate(r.created_at);
  return `<div class="v-card" data-id="${r.id}">
    <div class="v-acts">
      <button class="btn-icon btn-sm edit-btn" data-id="${r.id}">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      </button>
      <button class="btn-icon btn-sm del-btn" data-id="${r.id}">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/></svg>
      </button>
    </div>
    <div class="v-card-top">
      <button class="v-pin-btn ${r.is_pinned?'pinned':''}" data-id="${r.id}" title="고정">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="${r.is_pinned?'currentColor':'none'}" stroke="currentColor" stroke-width="2"><path d="M12 2l1.5 5.5L19 9l-4 3.5L16 18l-4-3-4 3 1-5.5L5 9l5.5-1.5z"/></svg>
      </button>
      <div class="v-title">${SION.util.esc(r.title)}</div>
    </div>
    <div class="v-preview">${SION.util.esc(r.content)}</div>
    <div class="v-meta">
      ${r.category?`<span class="badge badge-기타" style="background:var(--ac-dim);color:var(--ac)">${SION.util.esc(r.category)}</span>`:''}
      ${r.tags?.length?`<div class="v-tags">${r.tags.slice(0,4).map(t=>`<span class="v-tag">${SION.util.esc(t)}</span>`).join('')}</div>`:''}
      <span class="v-date">${dt}</span>
    </div>
  </div>`;
}

function bindCardEvents(root){
  root.querySelectorAll('.v-card').forEach(card=>{
    card.addEventListener('click', e=>{
      if (e.target.closest('.v-acts') || e.target.closest('.v-pin-btn')) return;
      openEdit(card.dataset.id);
    });
  });
  root.querySelectorAll('.edit-btn').forEach(b=>b.addEventListener('click', e=>{e.stopPropagation();openEdit(b.dataset.id);}));
  root.querySelectorAll('.del-btn').forEach(b=>b.addEventListener('click', e=>{e.stopPropagation();del(b.dataset.id);}));
  root.querySelectorAll('.v-pin-btn').forEach(b=>b.addEventListener('click', e=>{e.stopPropagation();togglePin(b.dataset.id);}));
}

function renderSidebar(){
  // 카테고리 집계
  const cats = {};
  V.all.forEach(r=>{ const c=r.category||'미분류'; cats[c]=(cats[c]||0)+1; });
  const catRows = document.getElementById('cat-rows');
  document.getElementById('cn-all').textContent = V.all.length;
  const extra = Object.entries(cats).sort((a,b)=>b[1]-a[1]).map(([c,n])=>
    `<div class="cat-row ${V.fCat===c?'active':''}" data-cat="${SION.util.esc(c)}">${SION.util.esc(c)}<span class="cat-n">${n}</span></div>`
  ).join('');
  catRows.innerHTML = `<div class="cat-row ${V.fCat===''?'active':''}" data-cat="">📋 전체<span class="cat-n" id="cn-all">${V.all.length}</span></div>${extra}`;
  catRows.querySelectorAll('[data-cat]').forEach(row=>{
    row.addEventListener('click',()=>{ V.fCat = row.dataset.cat; render(); });
  });

  // 태그 클라우드
  const tagSet = {};
  V.all.forEach(r=> (r.tags||[]).forEach(t=> tagSet[t]=(tagSet[t]||0)+1));
  const tc = document.getElementById('tag-cloud');
  const tags = Object.keys(tagSet);
  if (!tags.length){ tc.innerHTML = `<div style="font-size:.74rem;color:var(--tx-4)">태그 없음</div>`; }
  else {
    tc.innerHTML = tags.slice(0,20).map(t=>
      `<span class="tcloud-tag ${V.fTag===t?'active':''}" data-tag="${SION.util.esc(t)}">${SION.util.esc(t)}</span>`
    ).join('');
    tc.querySelectorAll('[data-tag]').forEach(el=>{
      el.addEventListener('click',()=>{ V.fTag = (V.fTag===el.dataset.tag) ? '' : el.dataset.tag; render(); });
    });
  }

  const pinBtn = document.getElementById('pin-filter');
  pinBtn.classList.toggle('active', V.fPin);
}

async function togglePin(id){
  const item = V.all.find(r=>String(r.id)===String(id));
  if (!item) return;
  try{
    await SION.db.update('vault_items',`id=eq.${id}`,{is_pinned:!item.is_pinned});
    item.is_pinned = !item.is_pinned;
    SION.ui.toast(item.is_pinned?'고정됨':'고정 해제됨','success');
    render();
  }catch(e){ SION.ui.toast('오류','error'); }
}

async function del(id){
  if (!confirm('삭제하시겠습니까?')) return;
  try{
    await SION.db.remove('vault_items',`id=eq.${id}`);
    V.all = V.all.filter(r=>String(r.id)!==String(id));
    SION.ui.toast('삭제됨','success');
    SION.ui.closeModal('modal-vault');
    render();
  }catch(e){ SION.ui.toast('삭제 실패','error'); }
}

function renderFTags(){
  document.getElementById('form-tags').innerHTML = V.fTags.map((t,i)=>
    `<span class="tag">${SION.util.esc(t)}<span class="tag-remove" data-i="${i}">✕</span></span>`).join('');
  document.querySelectorAll('#form-tags .tag-remove').forEach(b=>
    b.addEventListener('click',()=>{ V.fTags.splice(Number(b.dataset.i),1); renderFTags(); }));
}

function setPinBox(v){
  V.formPinned = v;
  document.getElementById('form-pin-box').classList.toggle('checked', v);
}

function openAdd(){
  V.fTags = [];
  ['form-id','form-title','form-cat','form-content'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('form-del').style.display='none';
  renderFTags(); setPinBox(false);
  document.getElementById('modal-title').textContent='자료 추가';
  SION.ui.openModal('modal-vault');
  setTimeout(()=>document.getElementById('form-title').focus(),80);
}

function openEdit(id){
  const item = V.all.find(r=>String(r.id)===String(id));
  if (!item) return;
  V.fTags = Array.isArray(item.tags) ? [...item.tags] : [];
  document.getElementById('form-id').value = item.id;
  document.getElementById('form-title').value = item.title||'';
  document.getElementById('form-cat').value = item.category||'';
  document.getElementById('form-content').value = item.content||'';
  document.getElementById('form-del').style.display=''; document.getElementById('form-del').dataset.id=id;
  renderFTags(); setPinBox(!!item.is_pinned);
  document.getElementById('modal-title').textContent='자료 수정';
  SION.ui.openModal('modal-vault');
}

async function saveModal(){
  const title = document.getElementById('form-title').value.trim();
  const content = document.getElementById('form-content').value.trim();
  if (!title){ SION.ui.toast('제목을 입력하세요','error'); return; }
  if (!content){ SION.ui.toast('내용을 입력하세요','error'); return; }
  const id = document.getElementById('form-id').value;
  const body = {
    title, content,
    category: document.getElementById('form-cat').value.trim() || null,
    tags: V.fTags.length ? V.fTags : null,
    is_pinned: V.formPinned,
  };
  const btn = document.getElementById('form-save'); btn.disabled=true; btn.innerHTML=SION.ui.spinner(14)+' 저장중';
  try{
    if (id){
      const res = await SION.db.update('vault_items',`id=eq.${id}`,body);
      const upd = Array.isArray(res)?res[0]:res;
      const i = V.all.findIndex(r=>String(r.id)===String(id));
      if (i!==-1 && upd) V.all[i] = {...V.all[i], ...upd};
      SION.ui.toast('수정됨','success');
    } else {
      const res = await SION.db.insert('vault_items', body);
      const item = Array.isArray(res)?res[0]:res;
      if (item) V.all.unshift(item);
      SION.ui.toast('추가됨','success');
    }
    SION.ui.closeModal('modal-vault');
    render();
  }catch(e){ SION.ui.toast('저장 실패: '+e.message,'error'); }
  finally{ btn.disabled=false; btn.textContent='저장'; }
}

function initControls(){
  document.getElementById('v-search').addEventListener('input',
    SION.util.debounce(e=>{ V.fQ = e.target.value.trim(); render(); },250));
  document.getElementById('v-sort').addEventListener('change', e=>{ V.sort = e.target.value; render(); });
  document.querySelectorAll('.vt-btn').forEach(b=>b.addEventListener('click',()=>{
    document.querySelectorAll('.vt-btn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active'); V.view = b.dataset.vt; render();
  }));
  document.getElementById('pin-filter').addEventListener('click', function(){
    V.fPin = !V.fPin; render();
  });
  document.getElementById('btn-add-top').addEventListener('click', openAdd);
  document.getElementById('fab-add').addEventListener('click', openAdd);
  document.getElementById('form-pin-wrap').addEventListener('click', ()=> setPinBox(!V.formPinned));
  document.getElementById('form-tag-input').addEventListener('keydown', e=>{
    if (e.key==='Enter' || e.key===','){
      e.preventDefault();
      const v = e.target.value.trim().replace(/,$/,'');
      if (v && !V.fTags.includes(v)){ V.fTags.push(v); renderFTags(); }
      e.target.value='';
    }
  });
  document.getElementById('form-save').addEventListener('click', saveModal);
  document.getElementById('form-del').addEventListener('click', ()=>{
    const id = document.getElementById('form-del').dataset.id; if (id) del(id);
  });
}
</script>
</body>
</html>
