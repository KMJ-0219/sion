<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>SION</title>
  <link rel="stylesheet" href="sion.css"/>
  <style>
.main-layout{display:grid;grid-template-columns:1fr 300px;height:calc(100vh - 56px);overflow:hidden}
.chat-area{display:flex;flex-direction:column;overflow:hidden;border-right:1px solid var(--line-sub)}
.chat-header{padding:13px 18px;border-bottom:1px solid var(--line-sub);display:flex;align-items:center;gap:12px;flex-shrink:0;background:var(--bg-raised)}
.sion-av{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,#00c4a0,#007a62);display:flex;align-items:center;justify-content:center;font-family:var(--font-mono);font-weight:700;font-size:.72rem;color:var(--bg-base);flex-shrink:0;box-shadow:0 0 0 1px rgba(0,196,160,.25)}
.sion-nm{font-weight:700;font-size:.88rem;color:var(--tx-1);letter-spacing:.05em}
.sion-st{font-size:.66rem;color:var(--tx-3);font-family:var(--font-mono);display:flex;align-items:center;gap:4px}
.st-dot{width:5px;height:5px;border-radius:50%;background:var(--ac);animation:blink 2s ease-in-out infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.3}}
.model-badge{margin-left:auto;background:var(--bg-float);border:1px solid var(--line-mid);border-radius:6px;color:var(--tx-3);font-size:.68rem;padding:4px 8px;font-family:var(--font-mono);letter-spacing:.02em}
.chat-msgs{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.chat-empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--tx-3);text-align:center;padding:40px}
.empty-icon{width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,rgba(0,196,160,.1),rgba(0,196,160,.03));border:1px solid rgba(0,196,160,.18);display:flex;align-items:center;justify-content:center;font-size:1.3rem}
.empty-title{font-size:.95rem;font-weight:600;color:var(--tx-2)}
.empty-sub{font-size:.78rem;color:var(--tx-3);line-height:1.65;max-width:320px}
.quick-cmds{display:flex;flex-wrap:wrap;gap:5px;justify-content:center;margin-top:6px}
.qcmd{padding:4px 11px;border-radius:20px;border:1px solid var(--line-mid);background:var(--bg-raised);color:var(--tx-2);font-size:.72rem;cursor:pointer;transition:all .15s}
.qcmd:hover{border-color:var(--ac);color:var(--ac);background:var(--ac-dim)}
.msg{display:flex;gap:9px;max-width:88%}
.msg.user{flex-direction:row-reverse;align-self:flex-end}
.msg.assistant{align-self:flex-start}
.msg-av{width:26px;height:26px;border-radius:7px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.6rem;font-weight:700;font-family:var(--font-mono)}
.msg.assistant .msg-av{background:linear-gradient(135deg,#00c4a0,#007a62);color:var(--bg-base)}
.msg.user .msg-av{background:var(--bg-overlay);border:1px solid var(--line-mid);color:var(--tx-2)}
.msg-body{display:flex;flex-direction:column;gap:5px}
.bubble{padding:9px 12px;border-radius:11px;font-size:.86rem;line-height:1.65;word-break:break-word}
.msg.user .bubble{background:var(--ac);color:var(--bg-base);border-bottom-right-radius:2px}
.msg.assistant .bubble{background:var(--bg-float);border:1px solid var(--line-mid);color:var(--tx-1);border-bottom-left-radius:2px}
.msg.assistant .bubble strong{color:var(--ac);font-weight:600}
.msg.assistant .bubble code{background:var(--bg-overlay);padding:1px 5px;border-radius:3px;font-family:var(--font-mono);font-size:.8rem;color:#a78bfa}
.msg.assistant .bubble ul{padding-left:16px}
.msg.assistant .bubble li{margin:2px 0}
.msg-time{font-size:.6rem;color:var(--tx-4);font-family:var(--font-mono);padding:0 2px}
.msg.user .msg-time{text-align:right}
.action-card{padding:9px 11px;background:var(--bg-raised);border:1px solid var(--line-mid);border-left:3px solid var(--ac);border-radius:8px;font-size:.77rem;color:var(--tx-2);line-height:1.5}
.action-card.err{border-left-color:var(--red)}
.action-card-title{font-size:.68rem;font-weight:700;color:var(--ac);text-transform:uppercase;letter-spacing:.08em;margin-bottom:3px;display:flex;align-items:center;gap:5px}
.action-card.err .action-card-title{color:var(--red)}
.typing-ind{display:flex;align-items:center;gap:4px;padding:11px 13px;background:var(--bg-float);border:1px solid var(--line-mid);border-radius:11px;border-bottom-left-radius:2px;width:fit-content}
.tdot{width:5px;height:5px;border-radius:50%;background:var(--tx-3);animation:tdots 1.2s ease-in-out infinite}
.tdot:nth-child(2){animation-delay:.2s}.tdot:nth-child(3){animation-delay:.4s}
@keyframes tdots{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}
.chat-in-wrap{padding:11px 14px;border-top:1px solid var(--line-sub);background:var(--bg-raised);flex-shrink:0}
.chat-in-row{display:flex;gap:7px;align-items:flex-end;background:var(--bg-float);border:1px solid var(--line-mid);border-radius:11px;padding:7px 9px;transition:border-color .15s}
.chat-in-row:focus-within{border-color:var(--ac);box-shadow:0 0 0 3px var(--ac-soft)}
.chat-ta{flex:1;background:transparent;border:none;color:var(--tx-1);font-size:.86rem;resize:none;outline:none;min-height:20px;max-height:130px;line-height:1.5;font-family:var(--font-sans)}
.chat-ta::placeholder{color:var(--tx-3)}
.send-btn{width:30px;height:30px;border-radius:7px;background:var(--ac);color:var(--bg-base);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s}
.send-btn:hover{background:#00ddb5}
.send-btn:disabled{background:var(--bg-overlay);color:var(--tx-3);cursor:not-allowed}
.chat-hint{font-size:.62rem;color:var(--tx-4);margin-top:5px;text-align:center;font-family:var(--font-mono)}
.dash-panel{overflow-y:auto;display:flex;flex-direction:column;background:var(--bg-raised)}
.panel-sec{padding:13px 13px;border-bottom:1px solid var(--line-sub)}
.psec-t{font-size:.6rem;font-weight:700;color:var(--tx-3);text-transform:uppercase;letter-spacing:.12em;margin-bottom:7px;display:flex;align-items:center;justify-content:space-between}
.mini-stats{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-bottom:9px}
.ms-card{padding:9px 10px;background:var(--bg-float);border-radius:8px;border:1px solid var(--line-mid);cursor:pointer;transition:border-color .12s}
.ms-card:hover{border-color:var(--line-hi)}
.ms-n{font-size:1.3rem;font-weight:700;font-family:var(--font-mono);color:var(--tx-1);line-height:1;margin-bottom:1px}
.ms-n.ac{color:var(--ac)}
.ms-l{font-size:.6rem;color:var(--tx-3);text-transform:uppercase;letter-spacing:.06em}
.msched-item{display:flex;align-items:center;gap:6px;padding:4px 6px;border-radius:5px;font-size:.76rem;transition:background .12s}
.msched-item:hover{background:var(--bg-overlay)}
.mchk{width:13px;height:13px;border-radius:3px;border:1.5px solid var(--line-hi);flex-shrink:0;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .12s}
.mchk:hover{border-color:var(--ac)}
.mchk.done{background:var(--ac);border-color:var(--ac)}
.msched-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--tx-1)}
.msched-item.done .msched-name{text-decoration:line-through;color:var(--tx-3)}
.msched-t{font-size:.6rem;color:var(--tx-3);font-family:var(--font-mono);white-space:nowrap}
@media(max-width:1100px){.main-layout{grid-template-columns:1fr 250px}}
@media(max-width:800px){.main-layout{grid-template-columns:1fr}.dash-panel{display:none}}
  </style>
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-brand">
      <div class="brand-mark">SI</div>
      <span class="brand-name">SION</span>
    </div>
    <nav class="sidebar-nav">
      <span class="nav-section-label">메인</span>
      <a href="index.html" class="nav-link active">
        <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
        <span class="nav-label">대시보드</span>
      </a>
      <span class="nav-section-label">관리</span>
      <a href="schedule.html" class="nav-link">
        <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        <span class="nav-label">스케쥴</span>
        <span class="nav-badge" id="nb-sched">0</span>
      </a>
      <a href="vault.html" class="nav-link">
        <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
        <span class="nav-label">자료보관함</span>
      </a>
      <span class="nav-section-label">예정</span>
      <a href="#" class="nav-link" style="opacity:.35;pointer-events:none">
        <svg class="nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span class="nav-label">대화보관함</span>
      </a>
    </nav>
    <div class="sidebar-footer">
      <button class="sidebar-toggle" id="sidebarToggle">
        <svg class="toggle-ico nav-ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 19l-7-7 7-7M21 19l-7-7 7-7"/></svg>
        <span style="font-size:.8rem;color:var(--tx-3)">접기</span>
      </button>
    </div>
  </aside>

  <div class="content" id="content">
    <div class="topbar">
      <span class="topbar-path">SION /</span>
      <span class="topbar-title">SION AI</span>
      <div class="topbar-right">
        <span id="topbar-date" style="font-size:.78rem;color:var(--tx-3);font-family:var(--font-mono)"></span>
        <button class="btn btn-ghost btn-sm" id="btn-new-chat">
          <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          새 대화
        </button>
      </div>
    </div>

    <div class="main-layout">
      <!-- 채팅 -->
      <div class="chat-area">
        <div class="chat-header">
          <div class="sion-av">SI</div>
          <div>
            <div class="sion-nm">SION</div>
            <div class="sion-st">
              <div class="st-dot"></div>
              <span id="st-label">온라인 · 명령을 기다리는 중</span>
            </div>
          </div>
          <span class="model-badge">GPT-4o mini</span>
        </div>

        <div class="chat-msgs" id="chat-msgs">
          <div class="chat-empty" id="chat-empty">
            <div class="empty-icon">✦</div>
            <div class="empty-title">SION에게 무엇이든 물어보세요</div>
            <div class="empty-sub">일정 추가, 자료 보관, 정보 검색, 일반 대화 모두 가능합니다.<br>한 문장에 여러 요청을 함께 담아도 SION이 알아서 나눠 처리합니다.</div>
            <div class="quick-cmds">
              <button class="qcmd" data-cmd="오늘 일정 알려줘">📋 오늘 일정</button>
              <button class="qcmd" data-cmd="내일 오후 2시에 수학 시험 일정 추가해줘">📅 일정 추가</button>
              <button class="qcmd" data-cmd="이번 주 시험이 있어?">📝 시험 확인</button>
              <button class="qcmd" data-cmd="내일 오후 2시 수학 시험 일정 추가하고, 파이썬 딕셔너리 개념도 자료로 저장해줘">🧠 복수 명령 예시</button>
            </div>
          </div>
        </div>

        <div class="chat-in-wrap">
          <div class="chat-in-row">
            <textarea class="chat-ta" id="chat-ta" placeholder="SION에게 말을 걸어보세요... (Enter 전송, Shift+Enter 줄바꿈)" rows="1"></textarea>
            <button class="send-btn" id="send-btn" disabled>
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
            </button>
          </div>
          <div class="chat-hint">Enter 전송 · Shift+Enter 줄바꿈 · 한 번에 여러 명령 처리 가능</div>
        </div>
      </div>

      <!-- 오른쪽 대시 -->
      <div class="dash-panel">
        <div class="panel-sec">
          <div class="psec-t"><span>오늘 현황</span></div>
          <div class="mini-stats">
            <div class="ms-card" onclick="location.href='schedule.html'">
              <div class="ms-n ac" id="ms-today">—</div>
              <div class="ms-l">오늘 일정</div>
            </div>
            <div class="ms-card" onclick="location.href='schedule.html'">
              <div class="ms-n" id="ms-done">—</div>
              <div class="ms-l">완료됨</div>
            </div>
            <div class="ms-card" onclick="location.href='schedule.html'">
              <div class="ms-n" id="ms-exam">—</div>
              <div class="ms-l">시험 D-day</div>
            </div>
            <div class="ms-card" onclick="location.href='vault.html'">
              <div class="ms-n" id="ms-vault">—</div>
              <div class="ms-l">자료 수</div>
            </div>
          </div>
          <div id="mini-sched"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="toast-container"></div>
<script src="sion.js"></script>
<script>
SION.ui.initSidebar();

/* OpenAI를 브라우저에서 직접 호출하면 CORS에 막혀서 요청 자체가 안 나감.
   그래서 Supabase Edge Function을 중계 서버로 두고, 여기서는 그 함수만 호출함.
   → OpenAI 키는 이제 여기(클라이언트)에 존재하지 않고 Edge Function 시크릿에만 있음.
   ⚠️ 아래 프로젝트 ref는 실제 Supabase 프로젝트에 맞게 확인해서 넣어야 함 (sion.js의 SB_URL과 동일한 프로젝트). */
const EDGE_FN_URL = 'https://cszwasbxeczeocmdifqj.supabase.co/functions/v1/openai-chat';
const MODEL = 'gpt-4o-mini';

const PAD = SION.util.pad;
const DAYS = ['일','월','화','수','목','금','토'];

let msgs = [];       // 이번 세션 대화 컨텍스트 (영구 저장 안 함)
let todayData = [];
let thinking = false;

const now = new Date();
document.getElementById('topbar-date').textContent =
  `${now.getFullYear()}.${PAD(now.getMonth()+1)}.${PAD(now.getDate())} ${DAYS[now.getDay()]}`;

// ── 함수 호출(툴) 정의 — 새 스키마(schedules / vault_items) 기준 ──
const TOOLS = [
  {
    type: 'function',
    function: {
      name: 'add_schedule',
      description: '일정(과제, 수행평가, 시험, 약속, 기타)을 schedules 테이블에 추가한다.',
      parameters: {
        type: 'object',
        properties: {
          title:    { type: 'string', description: '일정 제목' },
          due_at:   { type: 'string', description: 'ISO 8601 형식 날짜/시간, 예: 2026-08-05T14:00:00' },
          category: { type: 'string', enum: ['과제','수행','시험','약속','기타'] },
          content:  { type: 'string', description: '상세 내용 (선택)' },
          location: { type: 'string', description: '장소/링크 등 부가 정보 (선택)' },
          tags:     { type: 'array', items: { type: 'string' }, description: '태그 (선택)' }
        },
        required: ['title','due_at']
      }
    }
  },
  {
    type: 'function',
    function: {
      name: 'add_vault',
      description: '정보/지식/메모를 vault_items 테이블(자료보관함)에 저장한다.',
      parameters: {
        type: 'object',
        properties: {
          title:    { type: 'string', description: '자료 제목' },
          content:  { type: 'string', description: '자료 전체 내용' },
          category: { type: 'string', description: '카테고리 (선택)' },
          tags:     { type: 'array', items: { type: 'string' }, description: '태그 (선택)' }
        },
        required: ['title','content']
      }
    }
  }
];

function sysprompt() {
  const n = new Date();
  const dt = `${n.getFullYear()}년 ${n.getMonth()+1}월 ${n.getDate()}일 ${DAYS[n.getDay()]}요일 ${PAD(n.getHours())}:${PAD(n.getMinutes())}`;
  const sched = JSON.stringify(todayData.map(d=>({이름:d.title,시간:d.due_at?.slice(0,16),카테고리:d.category,완료:d.is_done})));
  return `당신은 SION이라는 개인 AI 비서입니다. 현재 시각: ${dt}.

- 일정 추가 요청이 있으면 add_schedule 함수를 호출하세요.
- 정보/지식/메모 저장 요청이 있으면 add_vault 함수를 호출하세요.
- 한 메시지에 여러 요청이 섞여 있으면 필요한 함수를 각각 병렬로 호출하세요 (한 번에 여러 개 호출 가능).
- 날짜/시간이 불명확하면 오늘 또는 내일 기준으로 자연스럽게 추론하세요.
- 함수 호출이 필요 없는 일반 질문/대화는 자연스러운 한국어 마크다운으로 답하세요.
- 함수를 호출한 뒤에는 결과를 바탕으로 짧고 친근하게 한 줄 요약해주세요.

오늘 일정: ${sched}`;
}

async function callOpenAI(conversation, useTools) {
  const body = {
    model: MODEL,
    messages: [{ role:'system', content: sysprompt() }, ...conversation],
    temperature: 0.7,
  };
  if (useTools) {
    body.tools = TOOLS;
    body.tool_choice = 'auto';
    body.parallel_tool_calls = true;
  }
  // OpenAI를 직접 부르지 않고 Edge Function(EDGE_FN_URL)을 통해 대신 호출
  const r = await fetch(EDGE_FN_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  const d = await r.json().catch(()=>({}));
  if (!r.ok || d.error) {
    throw new Error(d.error?.message || `API 오류 ${r.status}`);
  }
  return d.choices[0].message;
}

async function execSched(a) {
  try {
    const body = {
      title: a.title,
      due_at: a.due_at ? new Date(a.due_at).toISOString() : null,
      category: a.category || '기타',
      content: a.content || null,
      location: a.location || null,
      tags: a.tags?.length ? a.tags : null,
      is_done: false
    };
    await SION.db.insert('schedules', body);
    await loadToday();
    return { type:'action_ok', at:'schedule', content:`✅ 일정이 추가됐어요`, detail:`**${a.title}** · ${a.category||'기타'} · ${a.due_at?a.due_at.slice(0,16).replace('T',' '):'시간 미정'}` };
  } catch(e) { return { type:'action_err', content:`일정 추가 실패: ${e.message}` }; }
}

async function execVault(a) {
  try {
    await SION.db.insert('vault_items', {
      title: a.title,
      content: a.content || null,
      category: a.category || '기타',
      tags: a.tags?.length ? a.tags : null,
      is_pinned: false
    });
    return { type:'action_ok', at:'vault', content:`✅ 자료가 보관됐어요`, detail:`**${a.title}** · ${a.category||'기타'}` };
  } catch(e) { return { type:'action_err', content:`자료 저장 실패: ${e.message}` }; }
}

function md(s) {
  if (!s) return '';
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/\*\*(.*?)\*\*/g,'<strong>$1</strong>')
    .replace(/`(.*?)`/g,'<code>$1</code>')
    .replace(/^- (.+)$/gm,'<li>$1</li>')
    .replace(/(<li>.*?<\/li>\n?)+/g, m => `<ul>${m}</ul>`)
    .replace(/\n/g,'<br>');
}

function addMsg(role, payload, t) {
  const el = document.getElementById('chat-msgs');
  document.getElementById('chat-empty')?.remove();

  const w = document.createElement('div');
  w.className = `msg ${role}`;
  const av = `<div class="msg-av">${role==='assistant'?'SI':'ME'}</div>`;

  let bub = '';
  if (role === 'user') {
    bub = `<div class="bubble">${SION.util.esc(payload)}</div>`;
  } else {
    const text = payload.text;
    const actions = payload.actions || [];
    if (text) bub += `<div class="bubble">${md(text)}</div>`;
    actions.forEach(a => {
      if (a.type === 'action_ok') {
        const ico = a.at==='schedule' ? '📅' : '📁';
        const lbl = a.at==='schedule' ? '일정 추가됨' : '자료 저장됨';
        bub += `<div class="action-card"><div class="action-card-title">${ico} ${lbl}</div><div>${md(a.detail)}</div></div>`;
      } else {
        bub += `<div class="action-card err"><div class="action-card-title">⚠ 오류</div><div>${md(a.content)}</div></div>`;
      }
    });
    if (!text && !actions.length) bub = `<div class="bubble" style="color:var(--tx-3)">(응답 없음)</div>`;
  }

  const time = `<div class="msg-time">${t}</div>`;
  w.innerHTML = `${av}<div class="msg-body">${bub}${time}</div>`;
  el.appendChild(w);
  el.scrollTop = el.scrollHeight;
}

function showTyping() {
  const el = document.getElementById('chat-msgs');
  document.getElementById('chat-empty')?.remove();
  const w = document.createElement('div');
  w.className = 'msg assistant'; w.id = 'typing-w';
  w.innerHTML = `<div class="msg-av">SI</div><div class="typing-ind"><div class="tdot"></div><div class="tdot"></div><div class="tdot"></div></div>`;
  el.appendChild(w); el.scrollTop = el.scrollHeight;
}
function hideTyping() { document.getElementById('typing-w')?.remove(); }
function nowTime() { const d=new Date(); return `${PAD(d.getHours())}:${PAD(d.getMinutes())}`; }

async function send(text) {
  if (!text.trim() || thinking) return;
  thinking = true;
  const sendBtn = document.getElementById('send-btn');
  const ta = document.getElementById('chat-ta');
  sendBtn.disabled = true; ta.value = ''; ta.style.height = 'auto'; updateBtn();

  addMsg('user', text, nowTime());
  msgs.push({ role:'user', content:text });
  showTyping();
  document.getElementById('st-label').textContent = '생각하는 중...';

  try {
    const msg = await callOpenAI(msgs, true);
    let actionResults = [];

    if (msg.tool_calls?.length) {
      msgs.push({ role:'assistant', content: msg.content || null, tool_calls: msg.tool_calls });

      for (const tc of msg.tool_calls) {
        let args = {};
        try { args = JSON.parse(tc.function.arguments || '{}'); } catch(e) {}
        let result;
        if (tc.function.name === 'add_schedule') result = await execSched(args);
        else if (tc.function.name === 'add_vault') result = await execVault(args);
        else result = { type:'action_err', content:'알 수 없는 요청이에요.' };

        actionResults.push(result);
        msgs.push({ role:'tool', tool_call_id: tc.id, content: JSON.stringify(result) });
      }

      const finalMsg = await callOpenAI(msgs, false);
      const finalText = finalMsg.content || (actionResults.every(r=>r.type==='action_ok') ? '요청하신 작업을 모두 완료했어요.' : '일부 작업에서 문제가 있었어요.');
      msgs.push({ role:'assistant', content: finalText });

      hideTyping();
      addMsg('assistant', { text: finalText, actions: actionResults }, nowTime());

      if (actionResults.some(r=>r.type==='action_ok')) { renderMiniSched(); loadStats(); }
    } else {
      msgs.push({ role:'assistant', content: msg.content });
      hideTyping();
      addMsg('assistant', { text: msg.content, actions: [] }, nowTime());
    }

    document.getElementById('st-label').textContent = '온라인 · 명령을 기다리는 중';
  } catch(e) {
    hideTyping();
    addMsg('assistant', { text:null, actions:[{type:'action_err', content:`오류: ${e.message}`}] }, nowTime());
    document.getElementById('st-label').textContent = '오류 발생';
    SION.ui.toast(e.message, 'error');
  }
  thinking = false; sendBtn.disabled = false; ta.focus();
}

async function loadToday() {
  const s=new Date();s.setHours(0,0,0,0);
  const e=new Date();e.setHours(23,59,59,999);
  try { todayData = await SION.db.select('schedules',`due_at=gte.${SION.date.toISO(s)}&due_at=lte.${SION.date.toISO(e)}&order=due_at.asc&limit=8`); }
  catch(err) { todayData = []; }
}

function renderMiniSched() {
  const el = document.getElementById('mini-sched');
  if (!todayData.length) { el.innerHTML = `<div style="font-size:.74rem;color:var(--tx-4);padding:3px 0">오늘 일정 없음</div>`; return; }
  el.innerHTML = todayData.map(item => `
    <div class="msched-item ${item.is_done?'done':''}" data-id="${item.id}">
      <div class="mchk ${item.is_done?'done':''}" data-id="${item.id}">
        ${item.is_done?`<svg width="7" height="7" viewBox="0 0 12 12"><polyline points="2,6 5,9 10,3" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>`:''}
      </div>
      <span class="msched-name">${SION.util.esc(item.title)}</span>
      <span class="msched-t">${SION.date.fmtDateTime(item.due_at)}</span>
    </div>`).join('');
  el.querySelectorAll('.mchk').forEach(btn => {
    btn.addEventListener('click', async e => {
      e.stopPropagation();
      const id = btn.dataset.id;
      const item = todayData.find(d=>String(d.id)===id);
      if (!item) return;
      try {
        await SION.db.update('schedules',`id=eq.${id}`,{is_done:!item.is_done});
        item.is_done=!item.is_done;
        btn.closest('.msched-item').classList.toggle('done',item.is_done);
        btn.classList.toggle('done',item.is_done);
        btn.innerHTML=item.is_done?`<svg width="7" height="7" viewBox="0 0 12 12"><polyline points="2,6 5,9 10,3" stroke="white" stroke-width="2.5" fill="none" stroke-linecap="round"/></svg>`:'';
        loadStats(); SION.ui.toast(item.is_done?'완료':'미완료로 변경','success');
      } catch(err) { SION.ui.toast('오류','error'); }
    });
  });
}

async function loadStats() {
  document.getElementById('ms-today').textContent = todayData.length;
  document.getElementById('ms-done').textContent  = todayData.filter(d=>d.is_done).length;
  try {
    const n=new Date();n.setHours(0,0,0,0);
    const ex=await SION.db.select('schedules',`category=eq.시험&is_done=eq.false&due_at=gte.${SION.date.toISO(n)}&order=due_at.asc&limit=1`);
    document.getElementById('ms-exam').textContent=ex.length?`D-${Math.round((new Date(ex[0].due_at)-n)/86400000)}`:'—';
  }catch(e){}
  try{const v=await SION.db.select('vault_items','select=id&limit=500');document.getElementById('ms-vault').textContent=v.length;}catch(e){}
  const nb=document.getElementById('nb-sched');if(nb)nb.textContent=todayData.filter(d=>!d.is_done).length;
}

function updateBtn() {
  document.getElementById('send-btn').disabled = !document.getElementById('chat-ta').value.trim() || thinking;
}
document.getElementById('chat-ta').addEventListener('input',function(){
  this.style.height='auto';this.style.height=Math.min(this.scrollHeight,130)+'px';updateBtn();
});
document.getElementById('chat-ta').addEventListener('keydown',function(e){
  if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();const v=this.value.trim();if(v)send(v);}
});
document.getElementById('send-btn').addEventListener('click',()=>{const v=document.getElementById('chat-ta').value.trim();if(v)send(v);});
document.querySelectorAll('.qcmd').forEach(b=>b.addEventListener('click',()=>send(b.dataset.cmd)));
document.getElementById('btn-new-chat').addEventListener('click',()=>{
  msgs=[];
  const el=document.getElementById('chat-msgs');
  el.innerHTML=`<div class="chat-empty" id="chat-empty">
    <div class="empty-icon">✦</div>
    <div class="empty-title">SION에게 무엇이든 물어보세요</div>
    <div class="empty-sub">일정 추가, 자료 보관, 정보 검색, 일반 대화 모두 가능합니다.<br>한 문장에 여러 요청을 함께 담아도 SION이 알아서 나눠 처리합니다.</div>
    <div class="quick-cmds">
      <button class="qcmd" data-cmd="오늘 일정 알려줘">📋 오늘 일정</button>
      <button class="qcmd" data-cmd="내일 오후 2시에 수학 시험 일정 추가해줘">📅 일정 추가</button>
      <button class="qcmd" data-cmd="이번 주 시험이 있어?">📝 시험 확인</button>
      <button class="qcmd" data-cmd="내일 오후 2시 수학 시험 일정 추가하고, 파이썬 딕셔너리 개념도 자료로 저장해줘">🧠 복수 명령 예시</button>
    </div>
  </div>`;
  el.querySelectorAll('.qcmd').forEach(b=>b.addEventListener('click',()=>send(b.dataset.cmd)));
});

(async()=>{
  await loadToday();
  renderMiniSched();
  await loadStats();
})();
</script>
</body>
</html>
